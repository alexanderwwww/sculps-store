<header data-m="hdr" style="position:fixed;left:0;right:0;top:0;height:6.5rem;z-index:40;display:flex;align-items:center;padding:0 2.06rem;pointer-events:none;">
  <div style="display:contents;pointer-events:auto;">
    <a href="/" data-m="brandlink" style="text-decoration:none;" aria-label="XERO home">
      <div data-m="brand" style="font-size:2.45rem;font-weight:700;letter-spacing:-.028em;line-height:1;color:var(--txt,#0e0e0e);"></div>
    </a>
    <nav data-m="nav" style="position:absolute;left:30.5%;width:37%;height:3.62rem;top:50%;margin-top:-1.81rem;border-radius:1.81rem;background:linear-gradient(180deg,var(--gloss,rgba(255,255,255,.46)),rgba(255,255,255,0) 46%,var(--glow,rgba(255,255,255,.22))),var(--pill,rgba(255,255,255,.72));backdrop-filter:blur(14px) saturate(1.7);border:1px solid var(--pill-b,rgba(0,0,0,.05));display:flex;align-items:center;box-shadow:inset 0 1px 0 var(--sheen,rgba(255,255,255,.88)),inset 0 -1px 0 var(--glow,rgba(255,255,255,.22)),0 .3rem 1.4rem var(--shadow,rgba(0,0,0,.10));">
      <a href="/#specs" data-act="goSpecs" style="flex:1;text-align:center;font-size:1.02rem;font-weight:450;color:var(--txt,#0e0e0e);white-space:nowrap;"></a>
      <div style="width:1px;height:1.5rem;background:var(--hair,rgba(0,0,0,.09));"></div>
      <a href="" data-m="navtrack" style="flex:1;text-align:center;font-size:1.02rem;font-weight:450;color:var(--txt,#0e0e0e);white-space:nowrap;"></a>
      <div style="width:1px;height:1.5rem;background:var(--hair,rgba(0,0,0,.09));"></div>
      <a href="" data-m="navact" style="flex:1;text-align:center;font-size:1.02rem;font-weight:450;color:var(--txt,#0e0e0e);white-space:nowrap;"></a>
      <div style="width:1px;height:1.5rem;background:var(--hair,rgba(0,0,0,.09));"></div>
      <button data-x="xh1" data-act="toggleCart" data-ref="cartBtnRef" style="flex:1;display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:1.06rem;font-weight:450;color:var(--txt,#0e0e0e);">
        <span data-m="navlbl">Cart</span>
        <span style="position:relative;display:inline-flex;">
          <svg width="21" height="21" viewBox="0 0 22 22" fill="none" stroke="var(--txt,#0e0e0e)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h2.2l2.1 9.2h9.1l1.9-6.8H5.3"></path><circle cx="8" cy="17.4" r="1.5"></circle><circle cx="15.4" cy="17.4" r="1.5"></circle></svg>
          <span style="position:absolute;right:-.62rem;top:-.6rem;min-width:1.22rem;height:1.22rem;padding:0 .25rem;border-radius:.61rem;background:var(--cartbadge,#ff3b30);color:#fff;font-size:.72rem;font-weight:600;line-height:1.22rem;text-align:center;letter-spacing:0;"><span data-bind="cartCount"></span></span>
        </span>
      </button>
    </nav>
    <button data-x="xh1" data-act="toggleMenu" style="position:absolute;right:2.06rem;top:50%;margin-top:-1.1rem;width:2.4rem;height:2.2rem;display:flex;flex-direction:column;justify-content:center;gap:.42rem;" aria-label="Menu">
      <span style="display:block;height:.155rem;border-radius:.1rem;background:var(--txt,#0e0e0e);"></span>
      <span style="display:block;height:.155rem;border-radius:.1rem;background:var(--txt,#0e0e0e);"></span>
      <span style="display:block;height:.155rem;border-radius:.1rem;background:var(--txt,#0e0e0e);"></span>
    </button>
  </div>
</header>
