<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>XSEARCH</title>
<style>
  :root{--glass:rgba(18,20,38,.55);--glass2:rgba(255,255,255,.06);--stroke:rgba(255,255,255,.12);--txt:#eaf0ff;--mut:#9aa3c9;--cyan:#7fe3ff;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--txt);overflow:hidden;
    background:radial-gradient(1100px 520px at 60% -8%,#3a2a6e 0,transparent 55%),radial-gradient(820px 520px at 92% 30%,#1d6f8f 0,transparent 50%),
      radial-gradient(700px 600px at 6% 80%,#15325c 0,transparent 55%),linear-gradient(160deg,#0a0a1c,#0c1130 55%,#070710);}
  .stars,.stars:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(1px 1px at 15% 25%,#fff,transparent),radial-gradient(1px 1px at 75% 55%,#cde,transparent),radial-gradient(1px 1px at 45% 78%,#fff,transparent),radial-gradient(1.3px 1.3px at 88% 18%,#fff,transparent);animation:tw 6s ease-in-out infinite alternate;}
  .stars:after{opacity:.22;transform:scale(1.5);animation-delay:-3s;}@keyframes tw{from{opacity:.25}to{opacity:.6}}
  .win{width:min(1120px,96vw);height:min(720px,92vh);border-radius:18px;background:var(--glass);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);border:1px solid var(--stroke);box-shadow:0 50px 130px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.07) inset;display:flex;flex-direction:column;overflow:hidden;}
  .bar{height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--stroke);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));}
  .lights{display:flex;gap:8px}.dot{width:12px;height:12px;border-radius:50%}.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .brand{font-weight:700;letter-spacing:.04em;font-size:16px;margin-left:6px}
  .tabs{display:flex;gap:6px;margin:0 auto;padding:5px;border-radius:14px;background:var(--glass2);border:1px solid var(--stroke);}
  .tab{padding:8px 16px;border-radius:10px;font-size:13px;color:var(--mut);font-weight:500}
  .tab.on{color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
  .srch{padding:8px 12px;border-radius:11px;background:var(--glass2);border:1px solid var(--stroke);font-size:12.5px;color:var(--mut);min-width:200px}
  .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#6b7bff,#36d0ff)}
  .main{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0;}
  .chat{border-right:1px solid var(--stroke);display:flex;flex-direction:column;min-height:0;padding:18px 16px;}
  .chat h3{font-size:11px;letter-spacing:.2em;color:var(--mut);margin-bottom:14px}
  .thread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
  .msg{border:1px solid var(--stroke);border-radius:14px;padding:12px 13px;background:rgba(255,255,255,.03)}
  .msg .h{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);margin-bottom:7px}
  .msg .h .who{color:#cdd6ff;font-weight:600}.msg .h .t{margin-left:auto;opacity:.6}
  .msg p{font-size:13px;line-height:1.55;color:#dde3ff;font-family:ui-monospace,Menlo,monospace}
  .ic{width:18px;height:18px;border-radius:6px;background:linear-gradient(135deg,#6b7bff,#36d0ff);display:inline-block}.ic.u{background:rgba(255,255,255,.14)}
  .live{border:1px solid var(--stroke);border-radius:14px;padding:14px;margin-top:12px;background:linear-gradient(180deg,rgba(120,140,255,.06),rgba(255,255,255,.01));}
  .live .lab{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;color:#7dffa6;margin-bottom:10px}
  .live .lab .pulse{width:8px;height:8px;border-radius:50%;background:#28c840;animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(40,200,64,.5)}70%{box-shadow:0 0 0 9px rgba(40,200,64,0)}100%{box-shadow:0 0 0 0 rgba(40,200,64,0)}}
  .live .mode{font-size:13px;margin-bottom:12px}.live .log div{font-size:12.5px;color:var(--mut);font-family:ui-monospace,monospace;margin-bottom:8px}
  .composer{margin-top:14px;display:flex;align-items:center;gap:8px;border:1px solid var(--stroke);border-radius:14px;padding:6px 6px 6px 14px;background:rgba(255,255,255,.04)}
  .composer input{flex:1;background:transparent;border:0;outline:0;color:var(--txt);font-size:13px}.composer input::placeholder{color:var(--mut)}
  .composer button{width:38px;height:38px;border-radius:11px;border:0;cursor:pointer;background:linear-gradient(135deg,#6b7bff,#5b46e0);color:#fff;font-size:16px}
  .stage{display:grid;place-items:center;position:relative}
  .phone{width:300px;height:620px;border-radius:46px;background:#000;border:9px solid #1c1f2b;box-shadow:0 40px 90px rgba(0,0,0,.6);position:relative;overflow:hidden}
  .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#000;border-radius:18px;z-index:5}
  .sbar{display:flex;justify-content:space-between;padding:14px 22px 4px;font-size:12px;color:#fff;font-weight:600}
  .ptabs{display:flex;gap:18px;padding:6px 18px 8px;font-size:15px;color:#888;font-weight:600}.ptabs .a{color:#fff;border-bottom:2px solid #fff;padding-bottom:3px}
  .feed{height:474px;overflow-y:auto;padding:4px 12px 12px}.feed::-webkit-scrollbar{width:0}
  .card{display:flex;gap:11px;padding:11px 6px;border-bottom:1px solid rgba(255,255,255,.07);opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s}
  .card.in{opacity:1;transform:none}
  .thumb{position:relative;width:74px;height:74px;border-radius:13px;flex:none}
  .score{position:absolute;top:5px;left:5px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:7px}
  .info{flex:1;min-width:0}.info .nm{font-size:14px;font-weight:600;color:#fff}.info .cat{font-size:11.5px;color:#8a90a8;margin:1px 0 5px}
  .info .pr{font-size:14px;color:#7fe3ff;font-weight:600}.info .src{font-size:11px;color:#8a90a8;margin-top:5px;display:flex;justify-content:space-between}.info .src b{color:#cdd6ff}
  .meter{height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#6b7bff,#36d0ff)}
  .nav{position:absolute;bottom:0;left:0;right:0;height:58px;display:flex;justify-content:space-around;align-items:center;background:rgba(0,0,0,.6);border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:#9aa}
</style>
</head>
<body>
<div class="stars"></div>
<div class="win">
  <div class="bar">
    <div class="lights"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="brand">XSEARCH</div>
    <div class="tabs"><div class="tab on">Scanner</div><div class="tab">Trends</div><div class="tab">Analytics</div><div class="tab">Lists</div></div>
    <div class="srch">Search products…  ⌘K</div><div class="av"></div>
  </div>
  <div class="main">
    <div class="chat">
      <h3>AGENT CHAT</h3>
      <div class="thread" id="thread"></div>
      <div class="live">
        <div class="lab"><span class="pulse"></span>LIVE</div>
        <div class="mode" id="mode">Idle</div>
        <div class="log">
          <div id="vids">watched 0 videos</div><div id="found">found 0 products</div><div id="srcstat">idle</div>
        </div>
      </div>
      <div class="composer"><input id="q" placeholder="Tell the agent what to find…"/><button id="go">➤</button></div>
    </div>
    <div class="stage">
      <div class="phone">
        <div class="notch"></div>
        <div class="sbar"><span>9:41</span><span>5G ▮▮▮</span></div>
        <div class="ptabs"><span class="a">For You</span><span>Following</span></div>
        <div class="feed" id="feed"></div>
        <div class="nav"><div>Home</div><div>Discover</div><div>+</div><div>Inbox</div><div>Profile</div></div>
      </div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const G=[["#c9d2e0","#8a94a8"],["#7c6cff","#36d0ff"],["#ff9f6b","#ffd06b"],["#36d399","#1f8f6b"],["#ff6cc4","#ff8f6b"],["#5bc0ff","#7c6cff"],["#4be0c0","#36d399"],["#9aa3c9","#5b6480"],["#ffb14e","#ff7a45"],["#9b8cff","#6b7bff"]];
function addMsg(who,text,me){const m=document.createElement("div");m.className="msg";
  m.innerHTML=`<div class="h"><span class="ic ${me?'u':''}"></span><span class="who">${who}</span><span class="t">now</span></div><p>${text}</p>`;
  $("thread").appendChild(m);$("thread").scrollTop=1e9;}
function card(p,i){const g=G[i%G.length];const views=p.engagement?.views||0;
  const cost=p.cost!=null?`$${Number(p.cost).toFixed(2)}`:"—";const margin=p.margin!=null?`${p.margin}%`:"—";
  const el=document.createElement("div");el.className="card";
  el.innerHTML=`<div class="thumb" style="background:linear-gradient(140deg,${g[0]},${g[1]})"><span class="score">${p.xScore??""}</span></div>
   <div class="info"><div class="nm">${p.title}</div><div class="cat">${p.category||""}</div>
   <div class="pr">${p.retailPrice!=null?"$"+Number(p.retailPrice).toFixed(2):""}</div>
   <div class="src"><span>1688 / CJ cost <b>${cost}</b></span><span><b>${margin}</b> margin</span></div>
   <div class="meter"><span style="width:${Math.min(100,views/12000)}%"></span></div></div>`;
  return el;}
let busy=false;
async function scan(query){
  if(busy)return;busy=true;$("feed").innerHTML="";
  $("mode").textContent="Learning Market Mode — scanning";$("vids").textContent="watched 0 videos";$("found").textContent="found 0 products";$("srcstat").textContent="contacting backend…";
  addMsg("XSEARCH AI",`Scanning for: <b style="color:#7fe3ff">${query}</b> …`);
  let data;
  try{
    const r=await fetch("/api/scan",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query})});
    data=await r.json();
  }catch(e){addMsg("XSEARCH AI",`Backend error: ${e.message}`);busy=false;return;}
  const products=data.products||[];let vids=0;
  for(let i=0;i<products.length;i++){
    const el=card(products[i],i);$("feed").appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("in")));
    vids+=Math.floor(6+Math.random()*22);
    $("vids").textContent=`watched ${vids} videos`;$("found").textContent=`found ${i+1} products`;
    $("srcstat").textContent=i<products.length-1?"ranking…":"done";
    await new Promise(r=>setTimeout(r,220));
  }
  addMsg("XSEARCH AI",`Done — <b>${products.length} products</b> from source <b>${data.source}</b>. Top: <b style="color:#7fe3ff">${products[0]?.title||"—"}</b>.`);
  $("mode").textContent="Idle";busy=false;
}
$("go").onclick=()=>{const q=$("q").value.trim()||"winning products on tiktok";addMsg("You",q,true);$("q").value="";scan(q);};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click();});
addMsg("You","Find winning products in home & kitchen.",true);
scan("home & kitchen");
</script>
</body>
</html>
