# mob — our own posting platform (YouTube Shorts, Instagram Reels, TikTok) for Content Rewards clipping.
# Standalone: deploying it never touches Kerberos.
name = "mob"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "gardenbuddy-media"

[triggers]
crons = ["*/5 * * * *", "* * * * *"]

# SYMBIOTE: one Durable Object that paper-trades every pump.fun launch (src/aq/sym/do.mjs). Paper only.
[[durable_objects.bindings]]
name = "SYMBIOTE"
class_name = "Symbiote"

[[migrations]]
tag = "sym-v1"
new_sqlite_classes = ["Symbiote"]
