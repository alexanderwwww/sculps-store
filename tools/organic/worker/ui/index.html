<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organic</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #0b0d0f;
    --ink-2: #4b5157;
    --ink-3: #8a9097;
    --line: rgba(11, 13, 15, .08);
    --line-2: rgba(11, 13, 15, .14);
    --green: #39FF7A;
    --green-ink: #0a8f3c;
    --amber: #ffb347;
    --grey: #c9ced3;
    --red: #ff5a5a;
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font);
    -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; -webkit-user-select: none;
    cursor: default;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  img { display: block; }

  /* ------------------------------------------------------------ chrome */
  #top {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
    pointer-events: none;
  }
  #top .mark { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .01em; }
  #top .mark i { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(57,255,122,.18); }
  #top .build { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }

  .view { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  .view.on { opacity: 1; pointer-events: auto; }

  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--grey); flex: 0 0 auto; transition: background .3s, box-shadow .3s; }
  .dot.waiting, .dot.checking { background: var(--amber); box-shadow: 0 0 0 3px rgba(255,179,71,.22); animation: breathe 1.6s ease-in-out infinite; }
  .dot.connected { background: var(--green); box-shadow: 0 0 0 3px rgba(57,255,122,.25), 0 0 14px rgba(57,255,122,.55); }
  .dot.out { background: var(--red); }
  @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

  /* ------------------------------------------------------------- setup */
  #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 40px 96px; gap: 34px; }
  #setup h1 { margin: 0; font-size: clamp(26px, 3.2vw, 38px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  #setup .sub { margin: 10px 0 0; color: var(--ink-2); font-size: 15px; text-align: center; }
  #cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; width: min(100%, 1120px); }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 40px -20px rgba(0,0,0,.18);
    padding: 16px; display: flex; flex-direction: column; gap: 14px; transition: box-shadow .3s, transform .3s, border-color .3s;
  }
  .card:hover { box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 24px 60px -24px rgba(0,0,0,.28); transform: translateY(-2px); }
  .card.connected { border-color: rgba(57,255,122,.6); }
  .card .head { display: flex; align-items: center; gap: 10px; }
  .card .head .name { font-weight: 600; font-size: 15px; }
  .card .head .meta { color: var(--ink-3); font-size: 12px; margin-left: auto; }
  .card .head .handle { color: var(--green-ink); font-weight: 600; font-size: 13px; margin-left: auto; }
  .screen {
    position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
    background: #f5f6f7; border: 1px solid var(--line); cursor: pointer;
    transition: box-shadow .3s;
  }
  .screen:hover { box-shadow: 0 0 0 3px rgba(57,255,122,.35); }
  .screen img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .screen .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 13px; }
  .screen img[src] + .empty { display: none; }
  .screen .hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%) translateY(6px); opacity: 0;
    padding: 5px 10px; border-radius: 999px; background: rgba(11,13,15,.78); color: #fff; font-size: 11px; font-weight: 600;
    transition: opacity .2s, transform .2s; white-space: nowrap; pointer-events: none;
  }
  .screen:hover .hint { opacity: 1; transform: translateX(-50%) translateY(0); }
  .connect {
    height: 38px; border-radius: 11px; border: 1px solid var(--line-2); font-weight: 600; font-size: 13px;
    transition: background .2s, color .2s, border-color .2s;
  }
  .connect:hover { background: #f5f6f7; }
  .connect.waiting { color: #a05b00; border-color: rgba(255,179,71,.6); background: rgba(255,179,71,.08); }
  .connect.connected { color: var(--green-ink); border-color: rgba(57,255,122,.7); background: rgba(57,255,122,.10); }

  #okwrap { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; pointer-events: none; }
  #ok {
    pointer-events: auto; height: 50px; padding: 0 40px; border-radius: 999px; background: var(--green); color: #05220f;
    font-weight: 700; font-size: 15px; letter-spacing: .01em; box-shadow: 0 10px 30px -10px rgba(57,255,122,.9), 0 1px 0 rgba(0,0,0,.05);
    transition: transform .15s, opacity .3s, box-shadow .3s;
  }
  #ok:hover { transform: translateY(-1px); }
  #ok:disabled { background: #eef0f2; color: var(--ink-3); box-shadow: none; cursor: default; transform: none; }

  /* ------------------------------------------------------------ focus */
  #mcp { margin-top: 10px; font-size: 11px; color: #9a9a9a; cursor: pointer; user-select: all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #mcp:hover { color: #444; }
  #mcp b { color: #111; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; }
  #focus { position: fixed; inset: 0; z-index: 20; background: rgba(255,255,255,.96); opacity: 0; pointer-events: none; transition: opacity .28s ease; display: flex; align-items: center; justify-content: center; }
  #focus.on { opacity: 1; pointer-events: auto; }
  /* Nothing shows through the focused screen: the header and OK fade out with it. */
  body:has(#focus.on) #top, body:has(#focus.on) #okwrap { opacity: 0; transition: opacity .2s ease; pointer-events: none; }
  #focus .stage {
    position: relative; border-radius: 16px; overflow: hidden; background: #fff; border: 1px solid var(--line);
    box-shadow: 0 40px 100px -30px rgba(0,0,0,.35), 0 0 0 1px rgba(57,255,122,.25), 0 0 60px -20px rgba(57,255,122,.6);
    transform: scale(.94); transition: transform .32s cubic-bezier(.22,.8,.28,1); cursor: default; outline: none;
  }
  #focus.on .stage { transform: scale(1); }
  #focus .stage img { width: 100%; height: 100%; object-fit: contain; }
  #focus .bar { position: fixed; top: 14px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 12px; pointer-events: none; }
  #focus .bar > * { pointer-events: auto; }
  #focus .who { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: rgba(11,13,15,.06); font-weight: 600; font-size: 13px; }
  #focus .who .k { color: var(--ink-3); font-weight: 500; }
  #done { padding: 8px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; font-size: 13px; box-shadow: 0 8px 24px -10px rgba(0,0,0,.5); }
  #done kbd { margin-left: 8px; font: 11px var(--font); opacity: .6; }

  /* ---------------------------------------------------------- working */
  #work { padding: 56px 24px 92px; }
  #grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 18px; height: 100%; }
  .tile {
    position: relative; display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--line); border-radius: var(--radius);
    background: #fff; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 16px 50px -30px rgba(0,0,0,.25);
    transition: box-shadow .3s, border-color .3s;
  }
  .tile.busy { border-color: rgba(57,255,122,.55); }
  .tile .shot { position: relative; flex: 1; min-height: 0; background: #f5f6f7; cursor: pointer; }
  .tile .shot img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
  .tile .shot .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 13px; }
  .tile .shot img[src] + .empty { display: none; }
  .tile .foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; }
  .tile .foot .name { font-weight: 600; }
  .tile .foot .handle { color: var(--ink-2); }
  .tile .foot .doing { margin-left: auto; color: var(--ink-3); font-size: 12px; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cur { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; transition: transform .38s cubic-bezier(.22,.8,.28,1), opacity .25s; z-index: 3; }
  .cur.on { opacity: 1; }
  /* The cursor is the thing Alex watches to know it is alive, so it glows
     and it pulses: a lit core, a halo, and a ring that breathes out of it. */
  .cur i {
    display: block; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
    background: radial-gradient(circle at 34% 34%, #fff 0, #8CFFB4 28%, var(--green) 52%, rgba(11,224,99,.35) 72%, transparent 76%);
    box-shadow: 0 0 10px rgba(57,255,122,1), 0 0 26px rgba(57,255,122,.85), 0 0 48px rgba(57,255,122,.45), 0 2px 8px rgba(0,0,0,.35);
    animation: curpulse 1.6s ease-in-out infinite;
  }
  .cur i::after {
    content: ""; position: absolute; left: -9px; top: -9px; width: 18px; height: 18px;
    border-radius: 50%; border: 2px solid rgba(57,255,122,.85); animation: curring 1.8s ease-out infinite;
  }
  @keyframes curpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  @keyframes curring {
    0% { transform: scale(.7); opacity: .9; }
    70% { transform: scale(2.6); opacity: 0; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  /* A short trail, so a move reads as a movement and not a teleport. */
  .cur.moving i { box-shadow: 0 0 12px rgba(57,255,122,1), 0 0 34px rgba(57,255,122,.9), 0 0 64px rgba(57,255,122,.5); }
  .cur b {
    position: absolute; left: 12px; top: 8px; white-space: nowrap; padding: 4px 9px; border-radius: 8px; font-size: 11px; font-weight: 600;
    background: rgba(11,13,15,.82); color: #fff; border: 1px solid rgba(57,255,122,.4); max-width: 220px; overflow: hidden; text-overflow: ellipsis;
  }
  .cur b:empty { display: none; }

  /* ticker tile / strip */
  #tickerTile { display: grid; grid-template-columns: 1.15fr 1fr; gap: 0 22px; padding: 18px 20px 14px; overflow: hidden; }
  #tickerTile > div { min-width: 0; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  #tickerTile h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
  .jobs { display: flex; flex-direction: column; gap: 5px; overflow: hidden; }
  .job { display: grid; grid-template-columns: 42px 12px 1fr; align-items: center; gap: 8px; font-size: 12.5px; line-height: 1.3; color: var(--ink-2); }
  .job .at { font-variant-numeric: tabular-nums; color: var(--ink-3); }
  .job .st { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); justify-self: center; }
  .job.doing .st { background: var(--green); box-shadow: 0 0 0 3px rgba(57,255,122,.25); animation: breathe 1.4s infinite; }
  .job.doing { color: var(--ink); font-weight: 600; }
  .job.done { opacity: .5; }
  .job.done .st { background: var(--green-ink); }
  .job.skipped { opacity: .4; text-decoration: line-through; }
  .job .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job .w b { font-weight: 600; color: var(--ink); }
  .jobs .more { font-size: 11px; color: var(--ink-3); padding-left: 62px; }
  #strip .jobs { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  #strip .job { font-size: 11.5px; }
  .lines { display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  .line { display: flex; gap: 10px; font-size: 13px; line-height: 1.35; animation: rise .35s ease; }
  .line .who { flex: 0 0 74px; font-weight: 600; color: var(--ink); }
  .line .what { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line:last-child .who { color: var(--green-ink); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  #strip { position: fixed; left: 24px; bottom: 22px; width: min(26vw, 380px); z-index: 4; display: none; }
  #strip .line { font-size: 12px; }
  #strip .line:not(:last-child) { opacity: .55; }

  /* the pill */
  #pill {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 6;
    display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 16px; border-radius: 999px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid rgba(11,13,15,.1); box-shadow: 0 20px 50px -20px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.6);
    min-width: 360px; max-width: min(72vw, 720px); opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  #pill.on { opacity: 1; pointer-events: auto; }
  #pill .pulse { position: relative; width: 12px; height: 12px; flex: 0 0 auto; }
  #pill .pulse i { position: absolute; inset: 0; border-radius: 50%; background: var(--green); }
  #pill .pulse i + i { animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite; opacity: .6; }
  #pill.paused .pulse i { background: var(--amber); animation: none; }
  #pill.stopped .pulse i { background: var(--grey); animation: none; }
  @keyframes ping { 0% { transform: scale(1); opacity: .7 } 100% { transform: scale(3); opacity: 0 } }
  #pill .text { display: flex; flex-direction: column; gap: 5px; min-width: 0; flex: 1; }
  #pill .text .l { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pill .text .l b { font-weight: 600; }
  #pill .text .l span { color: var(--ink-2); }
  #pill .bar { height: 3px; border-radius: 3px; background: rgba(11,13,15,.08); overflow: hidden; }
  #pill .bar i { display: block; height: 100%; width: 0; background: var(--green); box-shadow: 0 0 10px rgba(57,255,122,.8); transition: width .6s ease; }
  #pill .dots { display: flex; gap: 4px; padding: 0 2px; }
  #pill .dots .dot { width: 8px; height: 8px; }
  /* A platform in the brief that is not connected yet: its dot is the way to connect it. */
  #pill .dots button { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 999px; cursor: default; }
  #pill .dots button.can { cursor: pointer; }
  #pill .dots button.can:hover { background: rgba(11,13,15,.06); }
  #pill .dots button .k { display: none; font-size: 11px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
  #pill .dots button.can .k { display: inline; }
  #stopBtn { height: 32px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; font-size: 12px; }
  #stopBtn.resume { background: var(--green); color: #05220f; }

  /* toasts */
  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-8px); z-index: 30; opacity: 0; transition: opacity .25s, transform .25s;
    padding: 8px 16px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; pointer-events: none;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: breathe 1s infinite; }

  @media (max-width: 1080px) {
    #setup { padding: 60px 24px 92px; gap: 26px; }
    #cards { gap: 14px; }
    .card { padding: 12px; gap: 10px; }
    #work { padding: 52px 16px 84px; }
    #grid { gap: 12px; }
    .line .who { flex-basis: 64px; }
  }
  @media (max-height: 720px) {
    #setup { gap: 20px; padding-top: 54px; }
    #setup .sub { margin-top: 6px; }
  }
</style>
</head>
<body>
  <div id="top">
    <div class="mark"><i></i><span>Organic</span></div>
    <div class="build" id="build"></div>
  </div>

  <section id="setup" class="view">
    <div>
      <h1>Connect your accounts</h1>
      <p class="sub">Sign in on the screens below — it is the real page, just small. Nothing is typed for you and nothing is stored.</p>
    </div>
    <div id="cards"></div>
    <div id="okwrap"><button id="ok" disabled>OK, start</button>
      <div id="mcp" title="Click to copy — add this in Claude as an MCP server"></div>
    </div>
  </section>

  <section id="work" class="view">
    <div id="grid"></div>
  </section>

  <div id="strip"><div class="lines" id="stripLines"></div><div class="jobs" id="stripJobs"></div></div>

  <div id="pill">
    <div class="pulse"><i></i><i></i></div>
    <div class="text"><div class="l" id="pillLine"><b>Organic</b> <span>· starting</span></div><div class="bar"><i id="pillBar"></i></div></div>
    <div class="dots" id="pillDots"></div>
    <button id="stopBtn">Stop</button>
  </div>

  <div id="focus">
    <div class="bar"><div class="who" id="focusWho"></div><button id="done">Done<kbd>esc</kbd></button></div>
    <div class="stage" id="stage" tabindex="0"></div>
  </div>

  <div id="toast"><i></i><span id="toastText">updating…</span></div>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  const PLATFORM = { instagram: "Instagram", tiktok: "TikTok", youtube: "YouTube", market: "Market" };
  const ORDER = ["instagram", "tiktok", "youtube"];

  /* ----------------------------------------------------------- state */
  const S = {
    phase: null, build: null, paused: false, stopped: false,
    screens: {},          // id → { id, platform, state, handle }
    focused: null,
    frames: {},           // id → { w, h }
    imgs: {},             // id → <img> (one per screen, moved between homes)
    ticker: [],
    plan: [],
    doing: {},            // id → text
    lastFrameAt: {},
  };

  /* -------------------------------------------------------- the images */
  function imgFor(id) {
    if (!S.imgs[id]) {
      const img = el("img");
      img.draggable = false;
      img.alt = "";
      S.imgs[id] = img;
    }
    return S.imgs[id];
  }
  function place(id, home) {
    const img = imgFor(id);
    if (img.parentElement !== home) home.insertBefore(img, home.firstChild);
  }

  /* ------------------------------------------------------------ setup */
  const cardsEl = $("#cards");
  const cards = {};
  function card(id) {
    if (cards[id]) return cards[id];
    const c = el("div", "card");
    const head = el("div", "head");
    const dot = el("i", "dot");
    const name = el("span", "name", PLATFORM[id]);
    const meta = el("span", "meta", id === "youtube" ? "optional" : "");
    const handle = el("span", "handle");
    head.append(dot, name, meta, handle);
    const screen = el("div", "screen");
    const empty = el("div", "empty", "waiting for the page…");
    const hint = el("div", "hint", "Click to sign in");
    screen.append(empty, hint);
    screen.addEventListener("click", () => focus(id));
    const btn = el("button", "connect", "Connect");
    btn.addEventListener("click", () => { if ((S.screens[id] || {}).state !== "waiting") send({ t: "connect", platform: id }); focus(id); });
    c.append(head, screen, btn);
    cardsEl.append(c);
    cards[id] = { root: c, dot, meta, handle, screen, btn };
    place(id, screen);
    return cards[id];
  }
  function paintCard(sc) {
    const c = card(sc.id);
    const st = sc.state || "none";
    c.dot.className = "dot " + st;
    c.root.classList.toggle("connected", st === "connected");
    c.handle.textContent = st === "connected" && sc.handle ? sc.handle : "";
    c.meta.style.display = st === "connected" && sc.handle ? "none" : "";
    c.btn.className = "connect " + st;
    c.btn.textContent =
      st === "connected" ? "Connected" :
      st === "waiting" ? "Sign in — the browser is in front of you" :
      st === "checking" ? "Checking…" :
      st === "out" ? "Signed out — connect again" : "Connect";
    if (S.focused !== sc.id) place(sc.id, c.screen);
  }

  /* --------------------------------------------------------- working */
  const gridEl = $("#grid");
  const tiles = {};
  function tile(id) {
    if (tiles[id]) return tiles[id];
    const t = el("div", "tile");
    const shot = el("div", "shot");
    const empty = el("div", "empty", "waiting for the page…");
    const cur = el("div", "cur"); cur.append(el("i"), el("b"));
    shot.append(empty, cur);
    shot.addEventListener("click", () => focus(id));
    const foot = el("div", "foot");
    const dot = el("i", "dot");
    const name = el("span", "name", PLATFORM[id]);
    const handle = el("span", "handle");
    const doing = el("span", "doing");
    foot.append(dot, name, handle, doing);
    t.append(shot, foot);
    tiles[id] = { root: t, shot, cur, dot, handle, doing };
    return tiles[id];
  }
  const tickerTile = el("div", "tile"); tickerTile.id = "tickerTile";
  const crewCol = el("div"); crewCol.append(el("h3", null, "The crew"), el("div", "lines"));
  const planCol = el("div"); planCol.append(el("h3", null, "Today"), el("div", "jobs"));
  tickerTile.append(crewCol, planCol);
  const tickerLines = $(".lines", crewCol);
  const planList = $(".jobs", planCol);

  function layoutGrid() {
    const yt = S.screens.youtube && S.screens.youtube.state === "connected";
    const order = ["instagram", "tiktok", "market", yt ? "youtube" : null];
    const want = order.map((id) => (id ? tile(id).root : tickerTile));
    // Reorder without tearing the images down.
    want.forEach((node, i) => { if (gridEl.children[i] !== node) gridEl.insertBefore(node, gridEl.children[i] || null); });
    while (gridEl.children.length > 4) gridEl.removeChild(gridEl.lastChild);
    for (const id of ["instagram", "tiktok", "market", "youtube"]) {
      const on = order.includes(id);
      if (on && S.focused !== id) place(id, tile(id).shot);
      tile(id).root.style.display = on ? "" : "none";
    }
    $("#strip").style.display = yt ? "" : "none";
  }
  function paintTile(sc) {
    const t = tile(sc.id);
    const st = sc.state || "none";
    t.dot.className = "dot " + (sc.id === "market" ? "connected" : st);
    t.handle.textContent = sc.id === "market" ? "Ad Library" : (st === "connected" && sc.handle ? sc.handle : st === "none" ? "" : st);
  }

  /* ----------------------------------------------------------- ticker */
  function renderLines(root, lines) {
    root.textContent = "";
    for (const l of lines) {
      const d = el("div", "line");
      d.append(el("span", "who", l.who), el("span", "what", l.what));
      root.append(d);
    }
  }
  function pushSay(m) {
    S.ticker.push(m);
    while (S.ticker.length > 40) S.ticker.shift();
    renderLines(tickerLines, S.ticker.slice(-7));
    renderLines($("#stripLines"), S.ticker.slice(-3));
    const last = S.ticker[S.ticker.length - 1];
    if (last && !S.progressHold) pillLine(last.who, last.what);
  }
  /* ------------------------------------------------------------- plan */
  function renderJobs(root, jobs, max) {
    root.textContent = "";
    const fmt = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0"); };
    for (const j of jobs.slice(0, max)) {
      const d = el("div", "job " + (j.state || "next"));
      const w = el("span", "w"); w.append(el("b", null, j.who), document.createTextNode(" · " + j.what));
      d.append(el("span", "at", fmt(j.at)), el("i", "st"), w);
      d.title = j.who + " · " + j.what;
      root.append(d);
    }
    if (jobs.length > max) root.append(el("div", "more", "+" + (jobs.length - max) + " more"));
  }
  function paintPlan() {
    // Doing first, then what is next in time order, then what is done; skipped last.
    const rank = { doing: 0, next: 1, done: 2, skipped: 3 };
    const jobs = S.plan.slice().sort((a, b) => (rank[a.state] ?? 1) - (rank[b.state] ?? 1) || new Date(a.at) - new Date(b.at));
    const room = Math.max(4, Math.floor((tickerTile.clientHeight - 60) / 23));
    renderJobs(planList, jobs, room);
    renderJobs($("#stripJobs"), jobs.filter((j) => j.state === "doing" || j.state === "next"), 3);
  }
  function pillLine(who, what) {
    const l = $("#pillLine"); l.textContent = "";
    l.append(el("b", null, who), el("span", null, " · " + what));
  }

  /* -------------------------------------------------------- the pill */
  function paintPill() {
    const pill = $("#pill");
    pill.classList.toggle("on", S.phase === "working");
    pill.classList.toggle("paused", S.paused && !S.stopped);
    pill.classList.toggle("stopped", S.stopped);
    const dots = $("#pillDots"); dots.textContent = "";
    const wanted = S.brief && Array.isArray(S.brief.platforms) && S.brief.platforms.length ? S.brief.platforms : ORDER;
    for (const id of ORDER) {
      const sc = S.screens[id] || { state: "none" };
      const st = sc.state || "none";
      // Not connected and in the brief → a button that opens that screen at its sign-in page.
      const can = st !== "connected" && st !== "checking" && wanted.includes(id);
      const b = el("button", "d" + (can ? " can" : ""));
      b.append(el("i", "dot " + st), el("span", "k", st === "waiting" ? "sign in to " + PLATFORM[id] : "connect " + PLATFORM[id]));
      b.title = PLATFORM[id] + (sc.handle ? " · " + sc.handle : can ? " · click to connect" : "");
      if (can) b.addEventListener("click", () => { if (st !== "waiting") send({ t: "connect", platform: id }); focus(id); });
      dots.append(b);
    }
    const b = $("#stopBtn");
    b.textContent = S.stopped ? "Resume" : S.paused ? "Resume" : "Stop";
    b.classList.toggle("resume", S.stopped || S.paused);
  }
  $("#stopBtn").addEventListener("click", () => {
    if (S.stopped || S.paused) send({ t: "resume" }); else send({ t: "stop" });
  });

  /* ------------------------------------------------------------ views */
  function paint() {
    $("#build").textContent = S.build ? "build " + S.build : "";
    $("#setup").classList.toggle("on", S.phase === "setup");
    $("#work").classList.toggle("on", S.phase === "working");
    for (const id of ORDER) paintCard(S.screens[id] || { id, state: "none" });
    let connected = 0;
    for (const id of ORDER) if (S.screens[id] && S.screens[id].state === "connected") connected++;
    $("#ok").disabled = connected < 1;
    if (S.phase === "working") {
      layoutGrid();
      paintPlan();
      for (const id of ["instagram", "tiktok", "youtube", "market"]) paintTile(S.screens[id] || { id, state: "none" });
    }
    paintPill();
    if (S.focused) paintFocusWho();
  }
  $("#ok").addEventListener("click", () => send({ t: "ok" }));

  /* ------------------------------------------------------------ focus */
  const focusEl = $("#focus"), stage = $("#stage");
  function paintFocusWho() {
    const sc = S.screens[S.focused] || {};
    const w = $("#focusWho"); w.textContent = "";
    w.append(el("i", "dot " + (sc.state || "none")), el("span", null, PLATFORM[S.focused] || S.focused));
    w.append(el("span", "k", sc.handle ? sc.handle : S.phase === "setup" ? "signing in happens in the browser window in front — this is the live view" : "your hands are on the page"));
  }
  function sizeStage() {
    if (!S.focused) return;
    const f = S.frames[S.focused] || { w: 1280, h: 720 };
    const ratio = f.w && f.h ? f.w / f.h : 16 / 9;
    const maxW = window.innerWidth - 56, maxH = window.innerHeight - 96;
    let w = maxW, h = w / ratio;
    if (h > maxH) { h = maxH; w = h * ratio; }
    stage.style.width = Math.round(w) + "px";
    stage.style.height = Math.round(h) + "px";
  }
  function focus(id) {
    if (S.focused === id) return;
    S.focused = id;
    place(id, stage);
    sizeStage();
    paintFocusWho();
    focusEl.classList.add("on");
    stage.focus({ preventScroll: true });
    sendFocus(id);
  }
  function unfocus() {
    if (!S.focused) return;
    const id = S.focused;
    S.focused = null;
    focusEl.classList.remove("on");
    paint();
    send({ t: "focus", id: null });
    if (S.phase === "working") place(id, tile(id).shot); else place(id, card(id).screen);
  }
  $("#done").addEventListener("click", unfocus);
  window.addEventListener("resize", () => { sizeStage(); if (S.phase === "working") paintPlan(); });

  // Forwarding. Normalized over the stage, which is sized to the frame's aspect.
  const mods = (e) => (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0);
  /*
   * Tell the worker the size of the window, so the page is laid out and
   * captured at exactly that — sharp on a Retina screen, and every click
   * mapping one to one instead of being guessed through a letterbox.
   */
  // The MCP address, always on screen, copied with a click.
  const mcpEl = document.getElementById("mcp");
  function paintMcp() {
    if (!mcpEl) return;
    if (!S.mcp) { mcpEl.textContent = ""; return; }
    mcpEl.innerHTML = "";
    mcpEl.append(el("b", null, "Claude connects here: "), document.createTextNode(S.mcp));
  }
  if (mcpEl) {
    mcpEl.addEventListener("click", () => {
      if (!S.mcp) return;
      navigator.clipboard?.writeText(S.mcp).then(
        () => { const was = mcpEl.textContent; mcpEl.textContent = "copied"; setTimeout(() => { mcpEl.textContent = was; paintMcp(); }, 900); },
        () => {},
      );
    });
  }

  function sendFocus(id) {
    const r = stage.getBoundingClientRect();
    send({
      t: "focus", id,
      w: Math.round(r.width || window.innerWidth - 56),
      h: Math.round(r.height || window.innerHeight - 96),
      dpr: window.devicePixelRatio || 1,
    });
  }
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    if (!S.focused) return;
    sizeStage();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (S.focused) sendFocus(S.focused); }, 250);
  });

  function norm(e) {
    const r = stage.getBoundingClientRect();
    return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
  }
  let moveQueued = null;
  stage.addEventListener("mousemove", (e) => {
    if (!S.focused) return;
    moveQueued = { t: "mouse", id: S.focused, kind: "move", ...norm(e), buttons: e.buttons, modifiers: mods(e) };
    if (!moveQueued.raf) requestAnimationFrame(() => { const m = moveQueued; moveQueued = null; if (m) send(m); });
    moveQueued.raf = true;
  });
  stage.addEventListener("mousedown", (e) => { if (!S.focused) return; e.preventDefault(); stage.focus({ preventScroll: true }); send({ t: "mouse", id: S.focused, kind: "down", ...norm(e), button: e.button, clicks: e.detail || 1, modifiers: mods(e) }); });
  stage.addEventListener("mouseup", (e) => { if (!S.focused) return; e.preventDefault(); send({ t: "mouse", id: S.focused, kind: "up", ...norm(e), button: e.button, clicks: e.detail || 1, modifiers: mods(e) }); });
  stage.addEventListener("contextmenu", (e) => e.preventDefault());
  stage.addEventListener("wheel", (e) => {
    if (!S.focused) return;
    e.preventDefault();
    const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
    send({ t: "mouse", id: S.focused, kind: "wheel", ...norm(e), dx: e.deltaX * k, dy: e.deltaY * k, modifiers: mods(e) });
  }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if (!S.focused) return;
    if (e.key === "Escape") { e.preventDefault(); unfocus(); return; }
    e.preventDefault();
    const printable = e.key.length === 1 && !e.ctrlKey && !e.metaKey;
    send({ t: "key", id: S.focused, kind: "down", key: e.key, code: e.code, text: printable ? e.key : "", modifiers: mods(e) });
  });
  window.addEventListener("keyup", (e) => {
    if (!S.focused) return;
    e.preventDefault();
    send({ t: "key", id: S.focused, kind: "up", key: e.key, code: e.code, text: "", modifiers: mods(e) });
  });

  /* ------------------------------------------------------------ cursor */
  function cursor(m) {
    S.cursorMoves = (S.cursorMoves || 0) + 1;
    const t = tiles[m.id]; if (!t) return;
    const r = t.shot.getBoundingClientRect();
    const img = S.imgs[m.id];
    // The image is object-fit: contain inside the shot; map onto the drawn area.
    let x = m.x * r.width, y = m.y * r.height;
    const f = S.frames[m.id];
    if (img && f && f.w && f.h) {
      const ratio = f.w / f.h, box = r.width / r.height;
      let dw = r.width, dh = r.height;
      if (ratio > box) dh = r.width / ratio; else dw = r.height * ratio;
      x = (r.width - dw) / 2 + m.x * dw; y = (r.height - dh) / 2 + m.y * dh;
    }
    t.cur.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
    t.cur.classList.add("on");
    t.cur.classList.add("moving");
    clearTimeout(t.cur.__still);
    t.cur.__still = setTimeout(() => t.cur.classList.remove("moving"), 420);
    $("b", t.cur).textContent = m.label || "";
    t.root.classList.add("busy");
    t.doing.textContent = m.label || "";
    clearTimeout(t.cur.__off);
    t.cur.__off = setTimeout(() => { t.cur.classList.remove("on"); t.root.classList.remove("busy"); }, 20000);
  }

  /* ---------------------------------------------------------- socket */
  let ws = null, tries = 0, sawState = false, disconnectTimer = null;
  function send(obj) { if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(obj)); } catch (e) { /* gone */ } } }
  function toast(text, on) { $("#toastText").textContent = text; $("#toast").classList.toggle("on", !!on); }
  function connect() {
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws";
    try { ws = new WebSocket(url); } catch (e) { return retry(); }
    ws.onopen = () => { tries = 0; };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.t === "frame") {
        const img = imgFor(m.id);
        img.src = "data:image/jpeg;base64," + m.jpeg;
        const prev = S.frames[m.id];
        S.frames[m.id] = { w: m.w, h: m.h };
        S.lastFrameAt[m.id] = Date.now();
        if (S.focused === m.id && (!prev || prev.w !== m.w || prev.h !== m.h)) sizeStage();
        return;
      }
      if (m.t === "state") {
        sawState = true;
        clearTimeout(disconnectTimer); toast("", false);
        const was = S.phase;
        S.phase = m.phase; S.build = m.build; S.paused = !!m.paused; S.stopped = !!m.stopped; S.brief = m.brief || null;
        S.mcp = m.mcp || S.mcp || "";
        paintMcp();
        S.screens = {};
        for (const sc of m.screens || []) S.screens[sc.id] = sc;
        if (was !== m.phase && S.focused) unfocus();
        paint();
        return;
      }
      if (m.t === "say") { pushSay(m); return; }
      if (m.t === "cursor") { cursor(m); return; }
      if (m.t === "plan") { S.plan = Array.isArray(m.jobs) ? m.jobs : []; paintPlan(); return; }
      if (m.t === "progress") {
        $("#pillBar").style.width = Math.max(0, Math.min(100, Number(m.pct) || 0)) + "%";
        if (m.doing) { pillLine(m.who || "Organic", m.doing); S.progressHold = true; clearTimeout(S.holdT); S.holdT = setTimeout(() => { S.progressHold = false; }, 4000); }
        else { S.progressHold = false; const last = S.ticker[S.ticker.length - 1]; if (last) pillLine(last.who, last.what); }
        return;
      }
    };
    ws.onclose = () => {
      ws = null;
      // The worker restarts on self-update; the window stays and says so.
      clearTimeout(disconnectTimer);
      disconnectTimer = setTimeout(() => toast(sawState ? "updating…" : "starting…", true), 800);
      retry();
    };
    ws.onerror = () => { try { ws && ws.close(); } catch (e) { /* fine */ } };
  }
  function retry() { tries++; setTimeout(connect, Math.min(3000, 400 + tries * 300)); }

  for (const id of ORDER) card(id);
  paint();
  connect();
  window.__organic = S;
})();
</script>
</body>
</html>
