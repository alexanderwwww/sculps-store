name = "daytrader"
main = "src/worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

[triggers]
crons = ["* * * * *"]
