<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="cryo">
  <title>cryo</title>
  <!--
    The icon, for a tab and an app shelf where a five-letter word is unreadable.
    Same idea reduced to one thing: the dial and its ring of cold light. It is
    the only part of the machine that is recognisable at sixteen pixels.
  -->
  <rect width="96" height="96" rx="21" fill="#0B1220" />
  <circle cx="48" cy="48" r="27" fill="none" stroke="#4FA3D4" stroke-width="4" opacity=".95" />
  <circle cx="48" cy="48" r="18" fill="none" stroke="#EAF4FB" stroke-width="7" stroke-linecap="round" />
</svg>
