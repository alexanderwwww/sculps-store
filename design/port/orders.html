  <sc-if value="{{ isOrders }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <h1 style="margin:0;font-size:20px;line-height:28px;font-weight:650">Orders</h1>
        <div style="display:flex;gap:8px">
          <button onClick="{{ openExport }}" style="height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12px;font-weight:550;cursor:pointer;box-shadow:var(--shadow)" style-hover="background:var(--hover)">Export</button>
          <button onClick="{{ createOrder }}" style="height:28px;padding:0 12px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;cursor:pointer" style-hover="background:var(--accent-hover)">Create order</button>
        </div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden">
        <div style="display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border);overflow-x:auto">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
            <button onClick="{{ t.select }}" style="height:30px;padding:0 10px;border-radius:8px;border:0;background:{{ t.bg }};color:{{ t.color }};font-size:13px;font-weight:550;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap" style-hover="background:var(--hover)">{{ t.label }}<span style="font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums">{{ t.count }}</span></button>
          </sc-for>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap">
          <div style="flex:1;min-width:180px;position:relative">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="var(--ink-3)" stroke-width="1.6" stroke-linecap="round" style="position:absolute;left:10px;top:8px"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
            <input value="{{ ordersQuery }}" onChange="{{ setOrdersQuery }}" placeholder="Search by order, customer, email or city" style="width:100%;height:32px;padding:0 10px 0 32px;border-radius:8px;border:1px solid var(--input-border);background:var(--input);font-size:13px">
          </div>
          <div style="position:relative">
            <button onClick="{{ toggleFilter }}" style="height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12px;font-weight:550;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow)" style-hover="background:var(--hover)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>Filter<sc-if value="{{ filterCount }}" hint-placeholder-val="{{ false }}"><span style="min-width:18px;height:18px;padding:0 5px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:11px;display:grid;place-items:center">{{ filterCount }}</span></sc-if></button>
            <sc-if value="{{ filterOpen }}" hint-placeholder-val="{{ false }}">
              <div onClick="{{ stop }}" style="position:absolute;right:0;top:38px;width:280px;background:var(--elev);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px;z-index:20;animation:kPop .14s ease-out;display:flex;flex-direction:column;gap:12px">
                <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:550;color:var(--ink-2)">Payment status<select value="{{ filters.payment }}" onChange="{{ setFilterPayment }}" style="height:32px;border-radius:8px;border:1px solid var(--input-border);background:var(--input);padding:0 8px;font-size:13px;color:var(--ink)"><option value="">Any</option><option value="Paid">Paid</option><option value="Refunded">Refunded</option></select></label>
                <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:550;color:var(--ink-2)">Bundle option<select value="{{ filters.bundle }}" onChange="{{ setFilterBundle }}" style="height:32px;border-radius:8px;border:1px solid var(--input-border);background:var(--input);padding:0 8px;font-size:13px;color:var(--ink)"><option value="">Any</option><sc-for list="{{ bundleNames }}" as="b" hint-placeholder-count="3"><option value="{{ b }}">{{ b }}</option></sc-for></select></label>
                <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:550;color:var(--ink-2)">Date<select value="{{ filters.date }}" onChange="{{ setFilterDate }}" style="height:32px;border-radius:8px;border:1px solid var(--input-border);background:var(--input);padding:0 8px;font-size:13px;color:var(--ink)"><option value="">Any time</option><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="7">Last 7 days</option></select></label>
                <div style="display:flex;justify-content:space-between"><button onClick="{{ clearFilters }}" style="border:0;background:transparent;color:var(--link);font-size:12px;font-weight:550;cursor:pointer;padding:0">Clear all</button><button onClick="{{ toggleFilter }}" style="height:28px;padding:0 12px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;cursor:pointer">Done</button></div>
              </div>
            </sc-if>
          </div>
          <div style="position:relative">
            <button onClick="{{ toggleSortMenu }}" style="height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12px;font-weight:550;display:inline-flex;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow)" style-hover="background:var(--hover)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v10M5 13l-2.5-2.5M5 13l2.5-2.5M11 13V3M11 3 8.5 5.5M11 3l2.5 2.5"/></svg>Sort</button>
            <sc-if value="{{ sortMenuOpen }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;right:0;top:38px;width:200px;background:var(--elev);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:20;animation:kPop .14s ease-out">
                <sc-for list="{{ sortOptions }}" as="s" hint-placeholder-count="4"><button onClick="{{ s.select }}" style="width:100%;text-align:left;padding:7px 10px;border:0;border-radius:7px;background:{{ s.bg }};cursor:pointer;font-size:13px;display:flex;justify-content:space-between;color:var(--ink)" style-hover="background:var(--hover)">{{ s.label }}<span style="color:var(--ink-2)">{{ s.mark }}</span></button></sc-for>
              </div>
            </sc-if>
          </div>
          <button onClick="{{ saveView }}" style="height:32px;padding:0 8px;border:0;background:transparent;color:var(--link);font-size:12px;font-weight:550;cursor:pointer">Save view</button>
        </div>
        <sc-if value="{{ hasSelection }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--sel);animation:kFade .12s">
            <span style="font-weight:600;margin-right:4px">{{ selectedCount }} selected</span>
            <button onClick="{{ bulkOrdered }}" style="height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12px;font-weight:550;cursor:pointer">Mark as ordered with supplier</button>
            <button onClick="{{ openExportSelected }}" style="height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12px;font-weight:550;cursor:pointer">Export selected</button>
            <button onClick="{{ clearSelection }}" style="margin-left:auto;height:28px;padding:0 8px;border:0;background:transparent;color:var(--ink-2);font-size:12px;cursor:pointer">Clear</button>
          </div>
        </sc-if>
        <sc-if value="{{ ordersEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="padding:56px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px">
            <span style="width:48px;height:48px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--ink-3)"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 3h12v14l-2-1.5L12 17l-2-1.5L8 17l-2-1.5L4 17z"/></svg></span>
            <div style="font-weight:650;font-size:14px">{{ emptyTitle }}</div>
            <div style="color:var(--ink-2);max-width:320px">{{ emptyBody }}</div>
            <button onClick="{{ clearAllOrderFilters }}" style="margin-top:6px;height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:12px;font-weight:550;cursor:pointer">Clear search and filters</button>
          </div>
        </sc-if>
        <sc-if value="{{ showOrdersTable }}" hint-placeholder-val="{{ true }}">
          <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;min-width:980px">
            <thead><tr style="height:40px;color:var(--ink-2);font-size:12px;font-weight:550;text-align:left;border-bottom:1px solid var(--border)">
              <th style="width:44px;padding:0 0 0 16px"><input type="checkbox" checked="{{ allSelected }}" onChange="{{ toggleAll }}" style="width:16px;height:16px;accent-color:var(--focus);cursor:pointer;display:block"></th>
              <th style="padding:0 12px;font-weight:550"><button onClick="{{ sortByNumber }}" style="border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px">Order<span>{{ sortMark.number }}</span></button></th>
              <th style="padding:0 12px;font-weight:550"><button onClick="{{ sortByDate }}" style="border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px">Date<span>{{ sortMark.date }}</span></button></th>
              <th style="padding:0 12px;font-weight:550"><button onClick="{{ sortByCustomer }}" style="border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px">Customer<span>{{ sortMark.customer }}</span></button></th>
              <th style="padding:0 12px;font-weight:550">Ship to</th>
              <th style="padding:0 12px;font-weight:550">Items</th>
              <th style="padding:0 12px;font-weight:550;text-align:right"><button onClick="{{ sortByTotal }}" style="border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px">Total<span>{{ sortMark.total }}</span></button></th>
              <th style="padding:0 12px;font-weight:550">Payment</th>
              <th style="padding:0 12px;font-weight:550">Status</th>
              <th style="padding:0 12px;font-weight:550">Tracking</th>
              <th style="width:44px"></th>
            </tr></thead>
            <tbody>
            <sc-for list="{{ orderRows }}" as="o" hint-placeholder-count="12">
              <tr onClick="{{ o.open }}" style="height:44px;border-bottom:1px solid var(--border);cursor:pointer;background:{{ o.rowBg }}" style-hover="background:var(--hover)">
                <td style="padding:0 0 0 16px" onClick="{{ stop }}"><input type="checkbox" checked="{{ o.selected }}" onChange="{{ o.toggle }}" style="width:16px;height:16px;accent-color:var(--focus);cursor:pointer;display:block"></td>
                <td style="padding:0 12px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;white-space:nowrap"><span style="display:inline-flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:{{ o.storeColor }}"></span>{{ o.number }}</span><sc-if value="{{ o.chargeback }}" hint-placeholder-val="{{ false }}"><span title="Chargeback open" style="margin-left:6px;display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--critical);vertical-align:middle"></span></sc-if></td>
                <td style="padding:0 12px;white-space:nowrap;color:var(--ink-2)">{{ o.date }}</td>
                <td style="padding:0 12px;white-space:nowrap;font-weight:500">{{ o.customer }}</td>
                <td style="padding:0 12px;white-space:nowrap;color:var(--ink-2)">{{ o.shipTo }}</td>
                <td style="padding:0 12px;white-space:nowrap;color:var(--ink-2);max-width:220px;overflow:hidden;text-overflow:ellipsis">{{ o.items }}</td>
                <td style="padding:0 12px;text-align:right;font-variant-numeric:tabular-nums;font-weight:500">{{ o.total }}</td>
                <td style="padding:0 12px"><span style="display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:550;background:var(--b-{{ o.payKind }}-bg);color:var(--b-{{ o.payKind }}-fg);white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8"></span>{{ o.payment }}</span></td>
                <td style="padding:0 12px"><span style="display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:550;background:var(--b-{{ o.stateKind }}-bg);color:var(--b-{{ o.stateKind }}-fg);white-space:nowrap"><span style="width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8"></span>{{ o.stateLabel }}</span></td>
                <td style="padding:0 12px;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2)">{{ o.tracking }}</td>
                <td style="padding:0 8px;position:relative" onClick="{{ stop }}">
                  <button onClick="{{ o.menu }}" style="width:28px;height:28px;border-radius:7px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;display:grid;place-items:center" style-hover="background:var(--border)"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.5" cy="8" r="1.4"/></svg></button>
                  <sc-if value="{{ o.menuOpen }}" hint-placeholder-val="{{ false }}">
                    <div style="position:absolute;right:8px;top:38px;width:230px;background:var(--elev);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:25;animation:kPop .14s ease-out">
                      <button onClick="{{ o.open }}" style="width:100%;text-align:left;padding:7px 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink)" style-hover="background:var(--hover)">View order</button>
                      <button onClick="{{ o.markOrdered }}" style="width:100%;text-align:left;padding:7px 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink)" style-hover="background:var(--hover)">Mark as ordered with supplier</button>
                      <button onClick="{{ o.addTracking }}" style="width:100%;text-align:left;padding:7px 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink)" style-hover="background:var(--hover)">Add tracking</button>
                      <button onClick="{{ o.print }}" style="width:100%;text-align:left;padding:7px 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink)" style-hover="background:var(--hover)">Print packing slip</button>
                      <div style="height:1px;background:var(--border);margin:4px 0"></div>
                      <button onClick="{{ o.refund }}" style="width:100%;text-align:left;padding:7px 10px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:13px;color:var(--critical)" style-hover="background:var(--hover)">Refund</button>
                    </div>
                  </sc-if>
                </td>
              </tr>
            </sc-for>
            </tbody>
          </table>
          </div>
        </sc-if>
        <sc-if value="{{ showOrdersCards }}" hint-placeholder-val="{{ false }}">
          <sc-for list="{{ orderRows }}" as="o" hint-placeholder-count="6">
            <button onClick="{{ o.open }}" style="width:100%;display:flex;flex-direction:column;gap:6px;padding:12px 16px;border:0;border-bottom:1px solid var(--border);background:transparent;text-align:left;color:var(--ink);cursor:pointer">
              <span style="display:flex;justify-content:space-between;width:100%"><span style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600">{{ o.number }}</span><span style="color:var(--ink-2);font-size:12px">{{ o.date }}</span></span>
              <span style="display:flex;justify-content:space-between;width:100%"><span style="font-weight:500">{{ o.customer }} · {{ o.shipTo }}</span><span style="font-variant-numeric:tabular-nums;font-weight:600">{{ o.total }}</span></span>
              <span style="display:flex;gap:6px"><span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:550;background:var(--b-{{ o.payKind }}-bg);color:var(--b-{{ o.payKind }}-fg)">{{ o.payment }}</span><span style="display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:8px;font-size:12px;font-weight:550;background:var(--b-{{ o.stateKind }}-bg);color:var(--b-{{ o.stateKind }}-fg)">{{ o.stateLabel }}</span></span>
            </button>
          </sc-for>
        </sc-if>
        <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 12px;color:var(--ink-2);font-size:12px">
          <span>{{ pageInfo }}</span>
          <button onClick="{{ prevPage }}" disabled="{{ noPrev }}" style="width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;opacity:{{ prevOpacity }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 4-4 4 4 4"/></svg></button>
          <button onClick="{{ nextPage }}" disabled="{{ noNext }}" style="width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;opacity:{{ nextOpacity }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 4 4 4-4 4"/></svg></button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- ORDER DETAIL -->
