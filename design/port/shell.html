
</helmet>
<div style="display:flex;flex-direction:column;height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:20px;overflow:hidden">

<!-- TOP BAR -->
<sc-if value="{{ notFullscreen }}" hint-placeholder-val="{{ true }}">
<header style="height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--topbar);color:var(--topbar-ink);position:relative;z-index:50">
  <span style="display:flex;align-items:center;gap:9px;flex:none;margin-right:4px">
    <img src="assets/logo-white.png" alt="Shop Admin" style="width:26px;height:26px;object-fit:contain;flex:none;display:block">
    <sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}"><span style="font-weight:650;font-size:13px;color:#fff;white-space:nowrap;letter-spacing:-.01em">Shop Admin</span></sc-if>
  </span>
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}"><button onClick="{{ openDrawer }}" style="width:36px;height:36px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:#fff;display:grid;place-items:center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button></sc-if>
  <div style="position:relative;flex:none;order:5">
    <button onClick="{{ toggleStoreMenu }}" style="display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);cursor:pointer;color:#fff" style-hover="background:rgba(255,255,255,.12)">
      <span style="width:8px;height:8px;border-radius:50%;background:{{ store.color }};flex:none"></span>
      <sc-if value="{{ notMobile }}" hint-placeholder-val="{{ true }}"><span style="font-weight:600;font-size:13px;white-space:nowrap">{{ store.name }}</span></sc-if>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity:.7"><path d="m4 6 4 4 4-4"/></svg>
    </button>
    <sc-if value="{{ storeMenuOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;right:0;top:40px;width:320px;z-index:60;background:var(--elev);color:var(--ink);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;animation:kPop .14s ease-out">
        <div style="padding:6px 10px 4px;font-size:11px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em">Switch store</div>
        <sc-for list="{{ storeOptions }}" as="s" hint-placeholder-count="4">
          <button onClick="{{ s.select }}" style="width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:{{ s.bg }};cursor:pointer;text-align:left;color:var(--ink)" style-hover="background:var(--hover)">
            <span title="{{ s.healthLabel }}" style="width:9px;height:9px;border-radius:50%;background:{{ s.health }};flex:none;box-shadow:0 0 0 3px {{ s.healthRing }}"></span>
            <span style="flex:1;min-width:0"><span style="display:block;font-weight:550;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.name }}</span><span style="display:block;font-size:12px;line-height:16px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.domain }}</span></span>
            <span style="text-align:right;flex:none;font-variant-numeric:tabular-nums"><span style="display:block;font-weight:600;line-height:16px">{{ s.revenue }}</span><span style="display:block;font-size:12px;line-height:16px;color:var(--ink-2)">{{ s.orderCount }}</span></span>
            <sc-if value="{{ s.active }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--link)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 8.5 6.5 12 13 4.5"/></svg></sc-if>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <div style="flex:1;display:flex;justify-content:center;min-width:0">
    <button onClick="{{ openPalette }}" style="width:100%;max-width:520px;height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:var(--search);color:#B5B5B5;cursor:text;text-align:left" style-hover="border-color:#616161">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Search</span>
      <span style="font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;border:1px solid #616161;color:#B5B5B5">⌘K</span>
    </button>
  </div>
  <div style="position:relative">
    <button onClick="{{ toggleBell }}" style="width:34px;height:34px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:#fff;display:grid;place-items:center;position:relative" style-hover="background:rgba(255,255,255,.08)">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 14V9a5 5 0 0 1 10 0v5l1.5 1.5H3.5z"/><path d="M8.5 17.5a1.5 1.5 0 0 0 3 0"/></svg>
    </button>
    <sc-if value="{{ bellOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;right:0;top:40px;width:340px;background:var(--elev);color:var(--ink);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);animation:kPop .14s ease-out;overflow:hidden">
        <div style="padding:12px 14px;border-bottom:1px solid var(--border);font-weight:650;display:flex;justify-content:space-between;align-items:center">Notifications<span style="font-size:12px;color:var(--ink-2);font-weight:450">{{ store.name }}</span></div>
        <sc-if value="{{ notifEmpty }}" hint-placeholder-val="{{ true }}"><div style="padding:28px 16px;text-align:center;color:var(--ink-2)">Nothing yet. Orders, tracking emails and payment alerts land here.</div></sc-if>
        <sc-for list="{{ notifications }}" as="n" hint-placeholder-count="4">
          <button onClick="{{ n.open }}" style="width:100%;display:flex;gap:10px;padding:10px 14px;border:0;border-bottom:1px solid var(--border);background:transparent;cursor:pointer;text-align:left" style-hover="background:var(--hover)">
            <span style="width:8px;height:8px;border-radius:50%;background:{{ n.color }};margin-top:6px;flex:none"></span>
            <span style="flex:1;min-width:0"><span style="display:block;color:var(--ink)">{{ n.text }}</span><span style="display:block;font-size:12px;color:var(--ink-2)">{{ n.time }}</span></span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <span style="width:30px;height:30px;border-radius:50%;background:#A78BFA;color:#14102A;display:grid;place-items:center;font-size:12px;font-weight:650;margin-left:2px;order:6;flex:none">AK</span>
</header>
</sc-if>

<div style="flex:1;min-height:0;display:flex">
<!-- SIDEBAR -->
<sc-if value="{{ showSidebar }}" hint-placeholder-val="{{ true }}">
<aside style="width:240px;flex:none;background:var(--side);display:flex;flex-direction:column;height:100%;border-right:1px solid var(--border)">
  <nav style="padding:12px 12px 4px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto">
    <button onClick="{{ goHome }}" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;font-size:13px;text-align:left;color:var(--ink);background:{{ nav.home }};box-shadow:{{ navShadow.home }};border-left:2px solid {{ navRail.home }}" style-hover="background:var(--side-hover)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 9.5 10 3l7 6.5V17H12v-4.5H8V17H3z"/></svg>Home</button>
    <button onClick="{{ goOrders }}" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;font-size:13px;text-align:left;color:var(--ink);background:{{ nav.orders }};box-shadow:{{ navShadow.orders }};border-left:2px solid {{ navRail.orders }}" style-hover="background:var(--side-hover)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 3h12v14l-2-1.5L12 17l-2-1.5L8 17l-2-1.5L4 17z"/><path d="M7 7h6M7 10h6"/></svg><span style="flex:1">Orders</span>
      <sc-if value="{{ hasNew }}" hint-placeholder-val="{{ true }}"><span style="min-width:22px;height:20px;padding:0 6px;border-radius:6px;background:var(--b-neutral-bg);color:var(--b-neutral-fg);font-size:12px;font-weight:600;display:grid;place-items:center">{{ newCount }}</span></sc-if></button>
    <button onClick="{{ goProducts }}" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;font-size:13px;text-align:left;color:var(--ink);background:{{ nav.products }};box-shadow:{{ navShadow.products }};border-left:2px solid {{ navRail.products }}" style-hover="background:var(--side-hover)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 3h6.5l7.5 7.5-6.5 6.5L3 9.5z"/><circle cx="6.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg><span style="flex:1">Products</span>
      <sc-if value="{{ hasProducts }}" hint-placeholder-val="{{ false }}"><span style="min-width:22px;height:20px;padding:0 6px;border-radius:6px;background:var(--b-neutral-bg);color:var(--b-neutral-fg);font-size:12px;font-weight:600;display:grid;place-items:center">{{ productCount }}</span></sc-if></button>
    <sc-for list="{{ navExtra }}" as="n" hint-placeholder-count="4">
      <button onClick="{{ n.go }}" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;font-size:13px;text-align:left;color:var(--ink);background:{{ n.bg }};box-shadow:{{ n.shadow }};border-left:2px solid {{ n.rail }}" style-hover="background:var(--side-hover)">
        <span style="width:20px;display:grid;place-items:center;flex:none;color:var(--ink-2)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="{{ n.icon }}"/></svg></span><span style="flex:1">{{ n.label }}</span>
        <sc-if value="{{ n.hasCount }}" hint-placeholder-val="{{ false }}"><span style="min-width:22px;height:20px;padding:0 6px;border-radius:6px;background:var(--b-neutral-bg);color:var(--b-neutral-fg);font-size:12px;font-weight:600;display:grid;place-items:center">{{ n.count }}</span></sc-if>
      </button>
    </sc-for>
    <button onClick="{{ goAnalytics2 }}" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;font-size:13px;text-align:left;color:var(--ink);background:{{ nav.analytics }};box-shadow:{{ navShadow.analytics }};border-left:2px solid {{ navRail.analytics }}" style-hover="background:var(--side-hover)">
      <span style="width:20px;display:grid;place-items:center;flex:none;color:var(--ink-2)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 16V9M10 16V4M16 16v-5"/></svg></span>Analytics</button>
    <button onClick="{{ goLive }}" style="display:flex;align-items:center;gap:10px;height:30px;padding:0 10px 0 40px;border-radius:8px;border:0;cursor:pointer;font-weight:500;font-size:13px;text-align:left;color:var(--ink);background:{{ nav.live }};box-shadow:{{ navShadow.live }};border-left:2px solid {{ navRail.live }}" style-hover="background:var(--side-hover)"><span style="flex:1">Live View</span><span style="width:7px;height:7px;border-radius:50%;background:#22C55E;animation:kPulse 1.6s ease-out infinite"></span></button>
    <button onClick="{{ goMeta }}" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;font-size:13px;text-align:left;color:var(--ink);background:{{ nav.meta }};box-shadow:{{ navShadow.meta }};border-left:2px solid {{ navRail.meta }}" style-hover="background:var(--side-hover)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 13.5c0-4.2 1.5-7 3.5-7 2.8 0 3.5 7 6.4 7 1.8 0 3.1-1.8 3.1-4.3S14.9 5 13.3 5C11 5 9.7 9.3 7.3 13.5"/></svg>Meta</button>
    <div style="padding:14px 10px 4px;font-size:12px;font-weight:600;color:var(--ink-2)">Sales channel</div>
    <button onClick="{{ goStore }}" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;font-size:13px;text-align:left;color:var(--ink);background:{{ nav.store }};box-shadow:{{ navShadow.store }};border-left:2px solid {{ navRail.store }}" style-hover="background:var(--side-hover)">
      <span style="width:20px;display:grid;place-items:center;flex:none;color:var(--ink-2)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 8l1.5-4h11L17 8M3 8v9h14V8M8 17v-5h4v5"/></svg></span><span style="flex:1">Online Store</span>
      <span onClick="{{ goEditor }}" style="font-size:12px;color:var(--link);font-weight:500">Customize</span></button>
    <button onClick="{{ goMedia }}" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;font-size:13px;text-align:left;color:var(--ink);background:{{ nav.media }};box-shadow:{{ navShadow.media }};border-left:2px solid {{ navRail.media }}" style-hover="background:var(--side-hover)">
      <span style="width:20px;display:grid;place-items:center;flex:none;color:var(--ink-2)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="m3 14 4.5-4.5 4 4 2.5-2.5 3 3"/></svg></span>Media</button>
  </nav>
  <div style="padding:8px 12px 12px;border-top:1px solid var(--border)">
    <button onClick="{{ goSettings }}" style="width:100%;display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;font-size:13px;text-align:left;color:var(--ink);background:{{ nav.settings }};box-shadow:{{ navShadow.settings }};border-left:2px solid {{ navRail.settings }}" style-hover="background:var(--side-hover)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>Settings</button>
  </div>
</aside>
</sc-if>

<!-- MOBILE DRAWER -->
<sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeDrawer }}" style="position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);animation:kFade .15s"></div>
  <aside style="position:fixed;left:0;top:0;bottom:0;width:280px;z-index:71;background:var(--side);display:flex;flex-direction:column;animation:kSlide .2s ease-out;box-shadow:var(--shadow-lg);overflow:auto">
    <div style="padding:14px 12px 8px;display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#A78BFA,#6D3DF5);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px">S</span><span style="flex:1;font-weight:650">Shop Admin</span><button onClick="{{ closeDrawer }}" style="border:0;background:transparent;cursor:pointer;color:var(--ink-2);padding:6px">✕</button></div>
    <div style="padding:4px 12px 8px;display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ storeOptions }}" as="s" hint-placeholder-count="4"><button onClick="{{ s.select }}" style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;border:0;background:{{ s.bg }};cursor:pointer;text-align:left;color:var(--ink)"><span style="width:9px;height:9px;border-radius:50%;background:{{ s.color }}"></span><span style="flex:1;font-weight:550">{{ s.name }}</span></button></sc-for>
    </div>
    <nav style="padding:8px 12px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--border)">
      <button onClick="{{ goHome }}" style="display:flex;align-items:center;height:40px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;text-align:left;color:var(--ink);background:{{ nav.home }}">Home</button>
      <button onClick="{{ goOrders }}" style="display:flex;align-items:center;height:40px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;text-align:left;color:var(--ink);background:{{ nav.orders }}"><span style="flex:1">Orders</span><span style="min-width:22px;height:20px;padding:0 6px;border-radius:6px;background:var(--b-neutral-bg);color:var(--b-neutral-fg);font-size:12px;font-weight:600;display:grid;place-items:center">{{ newCount }}</span></button>
      <button onClick="{{ goAnalytics }}" style="display:flex;align-items:center;height:40px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-weight:550;text-align:left;color:var(--ink);background:{{ nav.analytics }}">Analytics</button>
      <button onClick="{{ goLive }}" style="display:flex;align-items:center;height:40px;padding:0 10px 0 28px;border-radius:8px;border:0;cursor:pointer;font-weight:500;text-align:left;color:var(--ink);background:{{ nav.live }}">Live View</button>
    </nav>
  </aside>
</sc-if>

<!-- MAIN -->
<div style="flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative">
  <sc-if value="{{ saveBar }}" hint-placeholder-val="{{ false }}">
    <div style="height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--topbar);color:#fff;animation:kDrop .18s ease-out">
      <span style="font-weight:600;flex:1">Unsaved changes</span>
      <button onClick="{{ discardChanges }}" style="height:30px;padding:0 12px;border-radius:8px;border:1px solid #616161;background:transparent;color:#fff;font-size:12px;font-weight:550;cursor:pointer">Discard</button>
      <button onClick="{{ saveChanges }}" style="height:30px;padding:0 12px;border-radius:8px;border:0;background:#fff;color:#1A1A1A;font-size:12px;font-weight:600;cursor:pointer">Save</button>
    </div>
  </sc-if>
  <main onClick="{{ closeMenus }}" style="flex:1;min-height:0;overflow:{{ mainOverflow }};padding:{{ pagePad }}">

  <!-- HOME -->
